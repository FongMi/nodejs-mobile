name: Publish release

# Step 2 of the guarded release (doc_mobile/RELEASING.md): runs when a
# `release:` commit (version bump in src/node_mobile_version.h) lands on a
# release branch — i.e. when the prepare-release PR is merged after its
# required checks are green. It tags and publishes; it does NOT decide whether
# tests passed (branch protection's required checks do that before merge).
#
# The actual tag + GitHub Release creation sits behind the `release`
# Environment, so a human with the reviewer role must approve the irreversible
# step. No individual pushes a tag by hand.
on:
  push:
    branches: [mobile/v24, main]
    paths: ['src/node_mobile_version.h']

permissions:
  contents: write
  actions: read    # read Build/Tier-2 run status + download release artifacts
  attestations: write
  id-token: write

jobs:
  guard:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_release: ${{ steps.v.outputs.is_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - name: Parse version + confirm release commit
        id: v
        run: |
          f=src/node_mobile_version.h
          MA=$(grep -oE 'NODE_MOBILE_MAJOR_VERSION [0-9]+' "$f" | awk '{print $2}')
          MI=$(grep -oE 'NODE_MOBILE_MINOR_VERSION [0-9]+' "$f" | awk '{print $2}')
          PA=$(grep -oE 'NODE_MOBILE_PATCH_VERSION [0-9]+' "$f" | awk '{print $2}')
          RE=$(grep -oE 'NODE_MOBILE_REVISION [0-9]+' "$f" | awk '{print $2}')
          echo "version=${MA}.${MI}.${PA}-${RE}" >> "$GITHUB_OUTPUT"
          # Only a real release: NODE_VERSION_IS_RELEASE flagged AND the head
          # commit is a `release:` commit (avoids firing on unrelated edits).
          REL=$(grep -cE '#define NODE_VERSION_IS_RELEASE 1' src/node_version.h || true)
          MSG=$(git log -1 --format=%s)
          if [ "$REL" = "1" ] && echo "$MSG" | grep -q '^release: nodejs-mobile '; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "Not a release commit (IS_RELEASE=$REL, msg='$MSG') — skipping publish."
          fi

  publish:
    needs: guard
    if: needs.guard.outputs.is_release == 'true'
    runs-on: ubuntu-24.04
    environment: release     # <-- approval gate for the irreversible tag+publish
    env:
      V: ${{ needs.guard.outputs.version }}
      SHA: ${{ github.sha }}
    steps:
      # Mint a short-lived token from the release GitHub App for the tag push and
      # the GitHub Release (see doc_mobile/RELEASING.md "One-time setup"). Export
      # it as GH_TOKEN so the gh steps below pick it up.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - run: echo "GH_TOKEN=${{ steps.app-token.outputs.token }}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      # "Tests pass before any release": branch protection requires the cheap
      # always-run checks (smoke/napi) to merge; here we additionally require the
      # heavy Tier-2 curated gate to be green for THIS commit. Each Tier-2
      # workflow runs a [full, lite] matrix, and a run only concludes success if
      # BOTH flavor legs (x both platforms) pass — so this single check covers
      # full AND lite. The gate runs on the release PR via the auto-added
      # `mobile-test` label; because releases are rebase/FF-merged (linear
      # patch-stack history), the PR head SHA == this commit, so the run is found.
      - name: Verify Tier-2 gate green for this commit
        run: |
          for wf in android-emulator-tests.yml ios-simulator-tests.yml; do
            ok=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$wf" --commit "$SHA" \
                   --status success --limit 1 --json databaseId -q '.[0].databaseId')
            [ -n "$ok" ] || { echo "::error::Tier-2 gate ($wf) is not green for $SHA. Run/await it (mobile-test label) before releasing."; exit 1; }
            echo "Tier-2 $wf green for $SHA (run $ok)"
          done

      # The release-commit push triggers ONE matrix Build that compiles BOTH
      # flavors (full + lite); the Tier-2 gate verified above already consumed
      # its artifacts, so it is green by now. Locate that run for the artifact
      # download. (A matrix run concludes success only if every flavor x arch
      # leg passed, so a single green run means both flavors built.)
      - name: Locate the Build run (both flavors) for this commit
        run: |
          run_id=""
          for _ in $(seq 1 60); do   # brief poll for run-index lag
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-mobile.yml --commit "$SHA" \
                       --status success --limit 1 --json databaseId -q '.[0].databaseId')
            [ -n "$run_id" ] && break
            sleep 30
          done
          [ -n "$run_id" ] || { echo "::error::no green (full+lite) Build run for $SHA"; exit 1; }
          echo "Build $run_id green for $SHA (both flavors via matrix)"
          echo "BUILD_RUN_ID=$run_id" >> "$GITHUB_ENV"

      - name: Download all flavor artifacts
        run: |
          mkdir -p dl
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir "dl/$BUILD_RUN_ID"
          # Flatten: each combined artifact dir contains bin/ + include/ (android)
          # or NodeMobile.xcframework + include/ (ios).
          find dl -maxdepth 2 -type d | sort

      - name: Package deterministic release zips
        run: |
          mkdir -p out
          UPSTREAM_REF=$(grep -Ev '^\s*(#|$)' doc_mobile/upstream-base.txt | head -n1 | tr -d '[:space:]')
          UPSTREAM_SHA=$(git rev-parse "${UPSTREAM_REF}^{commit}")
          ANDROID_NDK_REVISION=$(sed -n 's/^  ANDROID_NDK_REVISION: //p' .github/workflows/build-mobile.yml)
          ANDROID_API=$(sed -n 's/^  ANDROID_TARGET_SDK_VERSION: //p' .github/workflows/build-mobile.yml)
          [ -n "$ANDROID_NDK_REVISION" ] && [ -n "$ANDROID_API" ]
          pack() { # $1 = artifact name, $2 = target, $3 = flavor
            local src suffix=""
            local -a matches args
            mapfile -t matches < <(find dl -type d -name "$1" | sort)
            [ "${#matches[@]}" -eq 1 ] || { echo "::error::expected one $1 artifact, found ${#matches[@]}"; exit 1; }
            src="${matches[0]}"
            if [ "$3" = lite ]; then suffix="-lite"; fi
            args=(
              --source "$src"
              --output "out/nodejs-mobile-${2}${suffix}-${V}.zip"
              --target "$2"
              --flavor "$3"
              --version "$V"
              --repository "$GITHUB_REPOSITORY"
              --source-commit "$SHA"
              --upstream-ref "$UPSTREAM_REF"
              --upstream-commit "$UPSTREAM_SHA"
              --build-run-id "$BUILD_RUN_ID"
            )
            if [ "$2" = android ]; then
              args+=(--android-ndk-revision "$ANDROID_NDK_REVISION" --android-api "$ANDROID_API")
            fi
            python3 tools/mobile-release/package-artifact.py "${args[@]}"
          }
          pack nodejs-mobile-android       android full
          pack nodejs-mobile-android-lite  android lite
          pack nodejs-mobile-ios           ios full
          pack nodejs-mobile-ios-lite      ios lite
          ( cd out && sha256sum *.zip > SHA256SUMS )
          ls -la out

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.17.7
        with:
          path: dl
          format: spdx-json
          output-file: out/SBOM.spdx.json
          artifact-name: nodejs-mobile-${{ env.V }}-sbom.spdx.json
          upload-artifact: false

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.8.1

      - name: Sign release archives with Sigstore
        run: |
          for archive in out/*.zip; do
            cosign sign-blob --yes --bundle "${archive}.sigstore.json" "$archive"
          done

      - name: Attest build provenance
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v2.4.0
        with:
          subject-path: out/*.zip

      # Keep the tag reversible until every payload, digest, SBOM, signature and
      # attestation has been generated successfully.
      - name: Create + push tag
        run: |
          TAG="nodejs-mobile-${V}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::tag $TAG already exists"; exit 1
          fi
          git tag -a "$TAG" -m "nodejs-mobile ${V}" "$SHA"
          git push origin "$TAG"
          echo "Tagged $TAG at $SHA"

      - name: Create GitHub Release
        run: |
          TAG="nodejs-mobile-${V}"
          NOTES=$(awk '/^## /{c++} c==1{print} c==2{exit}' doc_mobile/CHANGELOG.md)
          gh release create "$TAG" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "nodejs-mobile ${V}" \
            --notes "${NOTES:-Release ${V}. See doc_mobile/CHANGELOG.md.}"
          echo "Published release $TAG"
