name: Build

on:
  # push-only: a same-repo PR head also matches these globs, so adding
  # pull_request would run every commit twice. (Add a fork-only-guarded
  # pull_request if external contributors ever open PRs.)
  push:
    branches: [main, fongmi, icu, 'mobile/**', 'claude/**', 'release/**']
  workflow_dispatch:

env:
  SCCACHE_GHA_ENABLED: 'true'
  SCCACHE_IDLE_TIMEOUT: '0'   # keep the sccache server alive through long builds
  ANDROID_NDK_VERSION: r27d
  ANDROID_NDK_REVISION: 27.3.13750724
  ANDROID_TARGET_SDK_VERSION: 24
  ANDROID_ELF_LDFLAGS: '-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384'
  # The fongmi branch builds only the two full-runtime ABIs shipped by TV.
  # Other branches retain the upstream full/lite and emulator coverage.
  # NOTE: the Android 16 KB-page LDFLAGS is set per-job on build-android only.
  # Setting it globally leaks -Wl,-z,max-page-size into the iOS link, which
  # Apple's ld rejects ("ld: unknown options: -z").

permissions:
  contents: read

jobs:
  build-android:
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON(github.ref_name == 'fongmi' && '["full"]' || '["full","lite"]') }}
        config: ${{ fromJSON(github.ref_name == 'fongmi' && '[{"os":"ubuntu-24.04","target_arch":"arm"},{"os":"ubuntu-24.04","target_arch":"arm64"}]' || '[{"os":"ubuntu-24.04","target_arch":"arm"},{"os":"ubuntu-24.04","target_arch":"arm64"},{"os":"ubuntu-24.04","target_arch":"x86_64"}]') }}

    runs-on: ${{ matrix.config.os }}
    env:
      TARGET_ARCH: ${{ matrix.config.target_arch }}
      NODEJS_MOBILE_FLAVOR: ${{ matrix.flavor }}
      FLAVOR_SUFFIX: ${{ matrix.flavor == 'lite' && '-lite' || '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Install build utils
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      - name: Setup Android NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        id: setup-ndk
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          add-to-path: false

      - name: Verify Android NDK revision
        env:
          MY_ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          actual=$(sed -n 's/^Pkg.Revision = //p' "$MY_ANDROID_NDK_HOME/source.properties")
          [ "$actual" = "$ANDROID_NDK_REVISION" ] || { echo "::error::Expected NDK $ANDROID_NDK_REVISION, got $actual"; exit 1; }

      # Key the built libnode on the git tree of everything that actually feeds
      # the build (src/deps/lib + the build files + pinned Android settings),
      # computed from git object IDs/values (instant + exact, vs hashFiles over
      # the huge deps/ tree). Test harness,
      # CI and docs are excluded, so a test-infra-only push reuses the binary
      # instead of paying the 1.5-3h compile.
      - name: Compute libnode cache key
        id: ck
        run: |
          H=$( { git rev-parse "HEAD:src" "HEAD:deps" "HEAD:lib" "HEAD:tools/v8_gypfiles" "HEAD:tools/gyp" "HEAD:tools/icu"; \
                 git hash-object node.gyp node.gypi common.gypi configure configure.py android-configure android_configure.py tools/android_build.sh tools/copy_libnode_headers.sh; \
                 printf '%s\n' "$ANDROID_NDK_REVISION" "$ANDROID_TARGET_SDK_VERSION" "$ANDROID_ELF_LDFLAGS"; \
               } | git hash-object --stdin )
          echo "key=$H" >> "$GITHUB_OUTPUT"

      - name: Cache built libnode
        id: libnode-cache
        uses: actions/cache@v4
        with:
          path: out_android
          key: libnode-android-${{ env.TARGET_ARCH }}${{ env.FLAVOR_SUFFIX }}-ndk${{ env.ANDROID_NDK_VERSION }}-${{ steps.ck.outputs.key }}

      - name: Build
        if: steps.libnode-cache.outputs.cache-hit != 'true'
        env:
          MY_ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          LDFLAGS: ${{ env.ANDROID_ELF_LDFLAGS }}
        run: |
          ./tools/android_build.sh $MY_ANDROID_NDK_HOME $ANDROID_TARGET_SDK_VERSION $TARGET_ARCH

      # Ship runtime binaries, not the very large compiler/debug symbol payload.
      # Run this after both cache hits and fresh builds so the public artifact is
      # deterministic even when an older unstripped out_android cache is restored.
      - name: Strip Android runtime
        env:
          MY_ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          STRIP="$MY_ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          mapfile -d '' LIBS < <(find out_android -type f -name libnode.so -print0)
          (( ${#LIBS[@]} > 0 )) || { echo "No libnode.so found under out_android" >&2; exit 1; }
          for SO in "${LIBS[@]}"; do
            "$STRIP" --strip-unneeded "$SO"
            stat --printf='%n %s bytes\n' "$SO"
          done

      - name: Audit Android runtime
        env:
          MY_ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          case "$TARGET_ARCH" in
            arm) ABI=armeabi-v7a; NDK_TRIPLE=arm-linux-androideabi ;;
            arm64) ABI=arm64-v8a; NDK_TRIPLE=aarch64-linux-android ;;
            x86_64) ABI=x86_64; NDK_TRIPLE=x86_64-linux-android ;;
            *) echo "::error::unsupported TARGET_ARCH=$TARGET_ARCH"; exit 1 ;;
          esac
          LIB_DIR="out_android/$ABI"
          NDK_LIB_DIR="$MY_ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/$NDK_TRIPLE"
          READELF="$MY_ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -f "$LIB_DIR/libnode.so" && test -f "$LIB_DIR/libc++_shared.so"
          cmp "$NDK_LIB_DIR/libc++_shared.so" "$LIB_DIR/libc++_shared.so"
          "$READELF" -dW "$LIB_DIR/libnode.so" | grep -F 'Shared library: [libc++_shared.so]'

          check_16k_load_alignment() {
            local so="$1" alignment
            local -a alignments
            mapfile -t alignments < <("$READELF" -lW "$so" | awk '$1 == "LOAD" { print $NF }')
            [ "${#alignments[@]}" -gt 0 ] || { echo "::error::No LOAD segments in $so"; return 1; }
            for alignment in "${alignments[@]}"; do
              if (( alignment < 0x4000 )); then
                echo "::error::$so has LOAD alignment $alignment; expected at least 0x4000"
                return 1
              fi
            done
            echo "$so LOAD alignments: ${alignments[*]}"
          }

          check_16k_load_alignment "$LIB_DIR/libnode.so"
          if [ "$TARGET_ARCH" != arm ]; then
            check_16k_load_alignment "$LIB_DIR/libc++_shared.so"
          else
            echo "32-bit ARM libc++ alignment is not a 16 KB-device gate"
          fi

      # Most NAPI/addon headers are static src/ + deps/ files, so stage them
      # unconditionally. Per-ABI config.gypi files remain in the cached build
      # output created by android_build.sh.
      - name: Stage NAPI/addon headers
        run: ./tools/copy_libnode_headers.sh android

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

      - uses: actions/upload-artifact@v4
        with:
          name: node-android-${{ matrix.config.target_arch }}-${{ matrix.flavor }}
          path: out_android

  build-ios:
    if: github.ref_name != 'fongmi'
    strategy:
      fail-fast: false
      matrix:
        flavor: [full, lite]
        config:
          # macos-26 is Apple Silicon with current Xcode (matches local dev).
          # x86_64 (Intel Mac) simulator support was dropped for v24 — Intel
          # Macs are EOL and Apple Silicon runs the arm64 simulator natively.
          - { os: macos-26, target_arch: arm64 }
          - { os: macos-26, target_arch: arm64-simulator }

    runs-on: ${{ matrix.config.os }}
    env:
      TARGET_ARCH: ${{ matrix.config.target_arch }}
      NODEJS_MOBILE_FLAVOR: ${{ matrix.flavor }}
      FLAVOR_SUFFIX: ${{ matrix.flavor == 'lite' && '-lite' || '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      # See build-android: key the built framework on the git tree of the build
      # inputs so test-infra-only pushes reuse it. Bump -vN if the macos runner
      # image's Xcode/SDK changes (the iOS toolchain isn't pinned like the NDK).
      - name: Compute libnode cache key
        id: ck
        run: |
          H=$( { git rev-parse "HEAD:src" "HEAD:deps" "HEAD:lib" "HEAD:tools/v8_gypfiles" "HEAD:tools/gyp" "HEAD:tools/icu"; \
                 git hash-object node.gyp node.gypi common.gypi configure configure.py tools/ios_framework_prepare.sh tools/copy_libnode_headers.sh; \
               } | git hash-object --stdin )
          echo "key=$H" >> "$GITHUB_OUTPUT"

      - name: Cache built libnode
        id: libnode-cache
        uses: actions/cache@v4
        with:
          path: out_ios_${{ env.TARGET_ARCH }}
          key: libnode-ios-${{ env.TARGET_ARCH }}${{ env.FLAVOR_SUFFIX }}-v1-${{ steps.ck.outputs.key }}

      # gyp-next needs setuptools at build time and a bare venv doesn't bundle
      # it (distutils was removed from the stdlib); install it explicitly.
      - name: Build
        if: steps.libnode-cache.outputs.cache-hit != 'true'
        run: |
          python3.12 -m venv .
          source bin/activate
          python3.12 -m pip install setuptools
          ./tools/ios_framework_prepare.sh $TARGET_ARCH

      - uses: actions/upload-artifact@v4
        with:
          name: node-ios-${{ matrix.config.target_arch }}-${{ matrix.flavor }}
          path: out_ios_${{ env.TARGET_ARCH }}

  combine-android:
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON(github.ref_name == 'fongmi' && '["full"]' || '["full","lite"]') }}
    runs-on: ubuntu-24.04
    needs: build-android
    env:
      NODEJS_MOBILE_FLAVOR: ${{ matrix.flavor }}
      FLAVOR_SUFFIX: ${{ matrix.flavor == 'lite' && '-lite' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Pull only THIS flavor's per-arch artifacts (node-android-<arch>-<flavor>);
      # the trailing -<flavor> keeps the full and lite combine legs from mixing.
      # Each carries per-ABI libnode.so + matching libc++_shared.so, a unique
      # config.gypi, and an identical include tree. No NDK/configure is needed
      # here. (merge-multiple only overwrites the identical header tree.)
      - uses: actions/download-artifact@v4
        with:
          pattern: node-android-*-${{ matrix.flavor }}
          merge-multiple: true
          path: out_android

      - name: Combine
        run: |
          mkdir -p artifacts/bin artifacts/config artifacts/include
          # Copy the per-abi binary dirs, not the shared libnode/ header dir.
          for d in out_android/*/; do
            [ "$(basename "$d")" = "libnode" ] && continue
            # strip the trailing slash so both GNU and BSD cp create bin/<abi>/
            cp -R "${d%/}" artifacts/bin/
          done
          cp -R out_android/libnode/config/* artifacts/config/
          cp -R out_android/libnode/include/* artifacts/include
          abis="armeabi-v7a arm64-v8a"
          if [ "$GITHUB_REF_NAME" != "fongmi" ]; then
            abis="$abis x86_64"
          fi
          for abi in $abis; do
            test -f "artifacts/bin/$abi/libnode.so"
            test -f "artifacts/bin/$abi/libc++_shared.so"
            test -f "artifacts/config/$abi/config.gypi"
          done
          ( cd artifacts && find . -type f ! -name ARTIFACT_SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > ARTIFACT_SHA256SUMS )

      - uses: actions/upload-artifact@v4
        with:
          name: nodejs-mobile-android${{ env.FLAVOR_SUFFIX }}
          path: artifacts

      # Delete only this flavor's per-arch artifacts so another flavor's
      # combine leg, when present, can still find its inputs.
      - uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          name: node-android-*-${{ matrix.flavor }}

  # B-1 tripwire: the shipped Android libnode.so must export the NAPI symbols a
  # dlopen'd addon resolves against. Reuses combine-android's artifact (no
  # rebuild — was a separate full build in mobile-napi-smoke.yml). The stronger
  # real-addon dlopen+run check lives in android-emulator-tests.yml.
  napi-smoke-android:
    needs: combine-android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nodejs-mobile-android
          path: artifacts

      - name: Assert NAPI symbols are exported
        run: |
          # arm64-v8a is the Android ABI folder for arm64 (see android_build.sh).
          # -D reads the DYNAMIC symbol table (.dynsym) — the export contract a
          # dlopen()'d addon resolves against. (GNU nm: --defined-only.)
          nm -D --defined-only artifacts/bin/arm64-v8a/libnode.so > exported_symbols.txt
          missing=0
          for sym in napi_get_cb_info napi_create_string_utf8 napi_throw_error; do
            if grep -qE "T $sym" exported_symbols.txt; then
              echo "OK: $sym is exported"
            else
              echo "MISSING: $sym is not exported"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::One or more NAPI symbols are missing from libnode.so (blocker B-1)"
            exit 1
          fi

  combine-ios:
    strategy:
      fail-fast: false
      matrix:
        flavor: [full, lite]
    runs-on: macos-26
    needs: build-ios
    env:
      NODEJS_MOBILE_FLAVOR: ${{ matrix.flavor }}
      FLAVOR_SUFFIX: ${{ matrix.flavor == 'lite' && '-lite' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Pull only THIS flavor's per-slice frameworks (node-ios-<arch>-<flavor>).
      - uses: actions/download-artifact@v4
        with:
          pattern: node-ios-*-${{ matrix.flavor }}
          merge-multiple: true
          path: out_ios

      # gyp-next needs setuptools at build time and a bare venv doesn't bundle
      # it (distutils was removed from the stdlib); install it explicitly.
      - name: Generate config.gypi
        run: |
          python3.12 -m venv .
          source bin/activate
          python3.12 -m pip install setuptools
          ./configure

      - name: Combine
        run: |
          python3.12 -m venv .
          source bin/activate
          python3.12 -m pip install setuptools
          ./tools/ios_framework_prepare.sh combine_frameworks
          mkdir -p artifacts/include
          cp -R out_ios/NodeMobile.xcframework artifacts/
          ./tools/copy_libnode_headers.sh ios
          cp -R out_ios/libnode/include/* artifacts/include

      - uses: actions/upload-artifact@v4
        with:
          name: nodejs-mobile-ios${{ env.FLAVOR_SUFFIX }}
          path: artifacts

      - uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          name: node-ios-*-${{ matrix.flavor }}

  # Tier 1 on-device smoke (doc_mobile/TEST_PLAN.md): boot an emulator, run a
  # console.log via the freshly built libnode, assert it ran and exited cleanly.
  # It requires the non-shipping x86_64 ABI, so the TV-only fongmi build skips it.
  smoke-android:
    if: github.ref_name != 'fongmi'
    needs: combine-android
    strategy:
      fail-fast: false
      matrix:
        flavor: [full, lite]
    runs-on: ubuntu-24.04
    env:
      NODEJS_MOBILE_FLAVOR: ${{ matrix.flavor }}
      FLAVOR_SUFFIX: ${{ matrix.flavor == 'lite' && '-lite' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Android NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        id: setup-ndk
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          add-to-path: false

      - uses: actions/download-artifact@v4
        with:
          name: nodejs-mobile-android${{ env.FLAVOR_SUFFIX }}
          path: artifacts

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # x86_64 runs natively on the runner CPU, so the emulator is fast. Use
      # the libc++ runtime shipped with the artifact. Comparing it to the
      # installed pinned NDK catches a mismatched or stale runtime immediately.
      - name: Build smoke embedder (x86_64)
        env:
          NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          ./tools/mobile-test/smoke/build-android-embedder.sh \
            "$NDK" x86_64 "$PWD/artifacts/bin/x86_64" "$PWD/node_smoke"
          cmp "$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android/libc++_shared.so" \
            "$PWD/artifacts/bin/x86_64/libc++_shared.so"

      - name: Run smoke on emulator
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: 30
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # NB: android-emulator-runner runs `script` line-by-line, so the
          # invocation must be a single line (no backslash continuations).
          script: |
            adb wait-for-device
            ./tools/mobile-test/smoke/run-android-smoke.sh "$PWD/node_smoke" "$PWD/artifacts/bin/x86_64/libnode.so" "$PWD/artifacts/bin/x86_64/libc++_shared.so"

  # Tier 1 on-device smoke for iOS: install the testnode app on a booted
  # simulator and run a console.log via the freshly built NodeMobile.xcframework.
  smoke-ios:
    needs: combine-ios
    strategy:
      fail-fast: false
      matrix:
        flavor: [full, lite]
    runs-on: macos-26
    env:
      NODEJS_MOBILE_FLAVOR: ${{ matrix.flavor }}
      FLAVOR_SUFFIX: ${{ matrix.flavor == 'lite' && '-lite' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          name: nodejs-mobile-ios${{ env.FLAVOR_SUFFIX }}
          path: artifacts

      # The testnode project references ../../../../out_ios/NodeMobile.xcframework.
      - name: Stage xcframework
        run: |
          mkdir -p out_ios
          cp -R artifacts/NodeMobile.xcframework out_ios/NodeMobile.xcframework

      - name: Build testnode app (simulator)
        run: ./tools/mobile-test/smoke/build-ios-testnode.sh "$PWD/out_testnode"

      - name: Boot simulator
        id: sim
        run: |
          # Newest available iOS runtime + the highest-numbered iPhone device
          # type. Picking the *last* iPhone in simctl's (unsorted) list can grab
          # an old model (e.g. iPhone 6s Plus) that the newest runtime doesn't
          # support, failing `simctl create` with SimError 403.
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; rs=sorted([x for x in json.load(sys.stdin)['runtimes'] if x.get('platform')=='iOS' and x.get('isAvailable')], key=lambda x:[int(n) for n in x['version'].split('.')]); print(rs[-1]['identifier'] if rs else '')")
          DEVICE_TYPE=$(xcrun simctl list devicetypes -j | python3 -c "import json,sys,re; ds=sorted([x for x in json.load(sys.stdin)['devicetypes'] if re.match(r'iPhone \d', x['name'])], key=lambda x:int(re.match(r'iPhone (\d+)', x['name']).group(1))); print(ds[-1]['identifier'] if ds else '')")
          echo "Using device=$DEVICE_TYPE runtime=$RUNTIME"
          test -n "$DEVICE_TYPE" && test -n "$RUNTIME"
          UDID=$(xcrun simctl create "nodejs-mobile-smoke" "$DEVICE_TYPE" "$RUNTIME")
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run smoke on simulator
        run: |
          ./tools/mobile-test/smoke/run-ios-smoke.sh \
            "$PWD/out_testnode/Release-iphonesimulator/testnode.app" \
            "${{ steps.sim.outputs.udid }}"

      - name: Shutdown simulator
        if: always()
        run: |
          xcrun simctl shutdown "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl delete "${{ steps.sim.outputs.udid }}" || true
