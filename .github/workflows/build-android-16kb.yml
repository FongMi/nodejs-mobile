name: Node Android 16 KB

on:
  push:
    branches: ['codex/16kb-android']
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: r24
  ANDROID_TARGET_SDK_VERSION: 24

jobs:
  build-android:
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target_arch: [arm, arm64]
    runs-on: ubuntu-22.04
    env:
      TARGET_ARCH: ${{ matrix.target_arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          add-to-path: false
      - name: Build 16 KB libnode
        env:
          MY_ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          LDFLAGS: '-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384'
        run: |
          ./tools/android_build.sh "$MY_ANDROID_NDK_HOME" "$ANDROID_TARGET_SDK_VERSION" "$TARGET_ARCH"
          rm -rf ./out_android/libnode
      - name: Verify ELF LOAD alignment
        env:
          MY_ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          readelf="$MY_ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          libnode="$(find out_android -type f -name libnode.so -print -quit)"
          test -n "$libnode"
          "$readelf" -lW "$libnode" | tee "libnode-${TARGET_ARCH}-program-headers.txt"
          "$readelf" -lW "$libnode" | awk '$1 == "LOAD" && $NF != "0x4000" { bad = 1 } END { exit bad }'
          sha256sum "$libnode" | tee "libnode-${TARGET_ARCH}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: node-android-${{ matrix.target_arch }}-16kb
          path: |
            out_android
            libnode-${{ matrix.target_arch }}-program-headers.txt
            libnode-${{ matrix.target_arch }}.sha256