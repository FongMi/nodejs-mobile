# Runs the curated Tier 2 subset of the Node.js JS suite on an Android emulator
# (doc_mobile/TEST_PLAN.md). Builds libnode for x86_64, builds + installs the
# testnode app, and drives test/parallel cases through the proxy harness.
#
# Runs on ubuntu + KVM (1x billing) rather than a macOS runner: the x86_64
# system image runs natively under KVM, so the emulator is fast and cheap. Still
# gated behind a nightly cron, the 'mobile-test' PR label, and workflow_dispatch
# because a full libnode build plus an emulator session is ~30-45 min.

name: Android Emulator Tests

on:
  schedule:
    # Nightly at 04:30 UTC.
    - cron: '30 4 * * *'
  # Only on an explicit 'mobile-test' label add: this job reuses the libnode
  # artifact the Build workflow produced for the commit, so add the label AFTER
  # Build is green (labeling before Build finishes fails the artifact fetch with
  # a clear message). 'needs:' can't span workflows, hence this label contract.
  # NB: Build only runs on push to build-mobile.yml's branch globs (main, icu,
  # mobile/**, claude/**) or its workflow_dispatch — so the head branch must
  # match one of those (or Build must be dispatched for the SHA) or the artifact
  # fetch below has nothing to find. workflow_dispatch on a matching branch is
  # the simplest path.
  pull_request:
    types: [labeled]
  workflow_dispatch:

env:
  SCCACHE_GHA_ENABLED: 'true'
  ANDROID_NDK_VERSION: r27d
  ANDROID_TARGET_SDK_VERSION: 24
  # x86_64 runs natively on the runner CPU under KVM, so the emulator is fast.
  TARGET_ARCH: x86_64
  EMULATOR_API_LEVEL: 30
  # testnode app/build.gradle pins this NDK for the CMake step that links the
  # prebuilt libnode.so; install it explicitly (see "Install testnode app NDK").
  TESTNODE_NDK_VERSION: 27.3.13750724
  # Only build the ABI the emulator runs; CMake imports a libnode.so per ABI.
  ORG_GRADLE_PROJECT_testnodeAbis: x86_64

permissions:
  contents: read
  # Needed to list/download the libnode artifact from the Build workflow run.
  actions: read

jobs:
  android-emulator-tests:
    # Cron and manual dispatch always run; on pull_request only when the
    # triggering label is exactly 'mobile-test'.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'mobile-test'

    # Both flavors run the SAME curated list: it has no sqlite/inspector/
    # strip-types tests, the ICU tests self-skip via common.hasIntl (false under
    # intl=none), and the lone WebAssembly-named test only inspects a string
    # fixture — verified all 151 pass on a local lite build. So lite is true
    # full-parity with no exclusions. Each flavor fetches its own libnode from
    # the same matrix Build run (which produces both).
    strategy:
      fail-fast: false
      matrix:
        flavor: [full, lite]

    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NODEJS_MOBILE_FLAVOR: ${{ matrix.flavor }}
      FLAVOR_SUFFIX: ${{ matrix.flavor == 'lite' && '-lite' || '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build utils
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      - name: Setup Android NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        id: setup-ndk
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          add-to-path: false

      # Reuse the libnode that build-mobile.yml already compiled for this commit
      # rather than rebuilding it here: a from-scratch libnode build is 1.5-3h and
      # overruns the job timeout. The testnode app only needs out_android/<abi>/
      # libnode.so (CMake IMPORTs it; native-lib.cpp forward-declares node::Start
      # and includes the repo's src/). build-mobile deletes the per-arch
      # node-android-* artifacts after combining, so pull the surviving combined
      # artifact (nodejs-mobile-android: bin/<abi>/libnode.so + headers) and stage
      # the ABI the emulator runs. Requires a successful Build for this SHA first.
      - name: Fetch libnode (Android) from the latest Build run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-mobile.yml \
                  --commit "$SHA" --status success --limit 1 --json databaseId -q '.[0].databaseId')
          if [ -z "$RUN" ]; then
            echo "::error::No successful Build run found for $SHA. Build only runs on push to its branch globs (main, icu, mobile/**, claude/**) or workflow_dispatch; dispatch/await Build for this SHA before the Tier-2 tests."
            exit 1
          fi
          # The matrix Build produces both flavors in one run, so fetch this
          # flavor's combined artifact (nodejs-mobile-android[-lite]).
          echo "Reusing ${NODEJS_MOBILE_FLAVOR} libnode from Build run $RUN"
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name "nodejs-mobile-android${FLAVOR_SUFFIX}" --dir nm-android
          mkdir -p "out_android/${TARGET_ARCH}"
          cp "nm-android/bin/${TARGET_ARCH}/libnode.so" "out_android/${TARGET_ARCH}/libnode.so"
          test -f "out_android/${TARGET_ARCH}/libnode.so" \
            || { echo "::error::libnode.so missing from nodejs-mobile-android${FLAVOR_SUFFIX}"; ls -R nm-android || true; exit 1; }

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install testnode app NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$TESTNODE_NDK_VERSION"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Native-addon gate: build the crc-native N-API addon against THIS build's
      # libnode + headers on the host (16 KB page-aligned, like libnode.so);
      # it's loaded on the emulator in the script below. Proves a real addon
      # dlopens + runs (the "B-1" concern the symbol-grep smoke approximates).
      - name: Build crc-native addon (x86_64)
        env:
          NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          ./tools/mobile-test/addon/build-android-addon.sh \
            "$NDK" "$TARGET_ARCH" "$PWD/out_android/${TARGET_ARCH}" \
            "$PWD/nm-android/include/node" "$PWD/crcnative.node"

      # Boot the emulator, build + install + prime the testnode app, then run the
      # curated subset through the proxy. Everything runs in one emulator-runner
      # script so the device stays alive for the whole session.
      - name: Run curated JS subset on emulator
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          target: default
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -e
            adb wait-for-device

            # Build + install the app and copy the bundled test assets, and drop
            # the proxy at out/android.release/node (+ the out/Release/node shim).
            ./tools/mobile-test/android/prepare-android-test.sh

            # Curated, deterministic subset (shared with the iOS workflow).
            # NB: android-emulator-runner runs `script` line-by-line, so this
            # pipeline must stay on one physical line (no `\` continuation).
            # --timeout=300: test.py's per-test wall-clock budget (scaled by host
            # arch) must exceed the proxy's 120s verdict poll so the PROXY is the
            # authoritative deadline and emits its no-verdict diagnostic before
            # test.py kills it (default 120s is co-equal on an x86_64 host -> race).
            grep -vE '^[[:space:]]*#|^[[:space:]]*$' tools/mobile-test/tier2-parallel-tests.txt | xargs ./tools/test.py -j 1 --flaky-tests=skip --timeout=300 --arch android

            # Native-addon gate: stage the prebuilt addon into the (primed) app and run it.
            ./tools/mobile-test/addon/run-android-addon.sh "$PWD/crcnative.node"
