# Fast host smoke test: builds Node natively on the runner (no cross-compile)
# and asserts the binary runs. Catches gross regressions in lib/internal and
# src/api introduced by the mobile patches before the slower cross-compile
# build-mobile workflow runs. Builds only the 'node' target with -j to stay
# under 15 minutes.

name: Host smoke

on:
  # push-only: a same-repo PR head also matches these globs, so adding
  # pull_request would run every commit twice.
  push:
    branches: ['mobile/**', 'claude/**']
  workflow_dispatch:

env:
  SCCACHE_GHA_ENABLED: 'true'
  SCCACHE_IDLE_TIMEOUT: '0'
  CC: sccache cc
  CXX: sccache c++

permissions:
  contents: read

jobs:
  smoke-host:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      # gyp-next needs setuptools at build time and a bare venv doesn't bundle
      # it (distutils was removed from the stdlib); install it explicitly.
      - name: Configure
        run: |
          python3.12 -m venv .
          source bin/activate
          python3.12 -m pip install setuptools
          ./configure

      - name: Build node target
        run: |
          source bin/activate
          make -j"$(nproc)" node

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Smoke test
        run: |
          ./out/Release/node -e "console.log(process.versions); process.exit(0)"
